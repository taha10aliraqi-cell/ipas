name: Build & Sign iOS IPA (TA Dashboard)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Sign iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16+
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: |
          npm install

      - name: 🩹 Patch Swift Tools Version for Xcode 16 Compatibility
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const item of list) {
                const fullPath = path.join(dir, item.name);
                if (item.isDirectory()) {
                  if (item.name !== '.git') results = results.concat(walk(fullPath));
                } else if (item.name === 'Package.swift') {
                  results.push(fullPath);
                }
              }
              return results;
            }
            const pkgs = walk('node_modules');
            pkgs.forEach(f => {
              let content = fs.readFileSync(f, 'utf8');
              if (content.includes('swift-tools-version: 6.2')) {
                content = content.replace(/swift-tools-version:\s*6\.2/g, 'swift-tools-version: 6.0');
                fs.writeFileSync(f, content);
                console.log('Patched swift-tools-version to 6.0 in:', f);
              }
            });
          "

      - name: ⚙️ Expo Prebuild (Generate Native iOS Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🛠️ Build Xcode Release Project (iPhone OS)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "Using Workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | head -n 1 | xargs)
          echo "Using Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: ✍️ Package & Ad-Hoc Sign IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"

          # Ad-Hoc self-sign the .app bundle
          codesign --force --deep --sign - "$APP_PATH"

          # Package into Payload for IPA standard format
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "TA-Dashboard.ipa" Payload/

          echo "IPA Created Successfully: TA-Dashboard.ipa"
          ls -lh TA-Dashboard.ipa

      - name: 📤 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TA-Dashboard-iOS-IPA
          path: TA-Dashboard.ipa
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          files: TA-Dashboard.ipa
          tag_name: v1.0.0-${{ github.run_number }}
          name: TA Dashboard iOS Release v1.0.0
          body: |
            ## 📱 TA Dashboard iOS IPA
            نسخة التطبيق الرسمية الموقعة والمجهزة للتثبيت المباشر على أجهزة الآيفون.

            ### طرق التثبيت المدعومة:
            1. **TrollStore** (تثبيت مباشر دائم بدون الحاجة لتجديد كل 7 أيام).
            2. **Scarlet / Esign / Gbox** (تثبيت مباشر من سفاري باستخدام شهادة المؤسسة).
            3. **AltStore / SideStore** (تثبيت عبر الكمبيوتر أو الواي فاي بحساب Apple ID).
            4. **Sideloadly** (تثبيت مباشر بنقرة واحدة من الكمبيوتر).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
